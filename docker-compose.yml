services:
  backend:
    build: ./backend
    container_name: enterprise_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/enterprise_ai
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      # Phase 6 — Qdrant vector database connection.
      - QDRANT_URL=http://qdrant:6333
      # Phase 5 — optional OpenAI embeddings (leave unset to use local models).
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - ./backend:/app
      # Persist uploaded documents (Phase 3) across container restarts.
      - uploads_data:/app/uploads
    networks:
      - enterprise_network

  postgres:
    image: postgres:16
    container_name: enterprise_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=enterprise_ai
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - enterprise_network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: enterprise_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # Qdrant exposes a readiness probe at :6333/readiness.
      test:
        [
          "CMD-SHELL",
          "bash -c '</dev/tcp/127.0.0.1/6333' && (curl -sf http://127.0.0.1:6333/readiness || wget -q -O - http://127.0.0.1:6333/readiness || true)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - enterprise_network

volumes:
  postgres_data:
  uploads_data:
  qdrant_storage:

networks:
  enterprise_network:
    driver: bridge